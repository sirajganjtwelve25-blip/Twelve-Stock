:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--paper:#1d2d4d;--card:#243659;--ink:#f2f5fb;--mu:#b8c2d8;--line:#3b4f78;--pb:#ff7fae;--pt:#2a0a18;--pl:#4a1630;--ok:#6fd6a4;--okb:#123826;--low:#f2b84b;--lowb:#41300a;--out:#8190b0;--wa:#f09595;--wab:#4a1b1b}

button{font:inherit;cursor:pointer;border:0}

.scan{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;min-height:72px;border-radius:20px;background:var(--pb);color:var(--pt);font-size:18px;font-weight:700}

  try{const b=new Blob([html],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';document.body.appendChild(a);a.click();a.remove();$('amsg').innerHTML='<div class="c">A new <b>index.html</b> was downloaded. Upload it to GitHub (Add file, Upload files) and the staff link will show the new stock.</div>'}catch(e){$('amsg').innerHTML='<div class="c err">Update failed: '+esc(e.message||'download failed')+'</div>'}
}
function guard(key,msg,box,btn){if(armed===key)return true;armed=key;box.innerHTML+='<div class="c">'+msg+'</div>';btn.textContent='Yes, update';return false}
function aggSale(){const b=+$('scol').value,q=+$('qcol').value,m=new Map();
  sale.rows.slice(sale.hi+1).forEach(r=>{const c=norm(r[b]),n=Number(r[q]);if(!c||r[q]===''||!isFinite(n))return;m.set(c,(m.get(c)||0)+n)});return m}
function calc(){armed=null;$('sap').textContent='Apply update';const m=aggSale(),mm=mk(D);let ok=0,pcs=0,un=[];
  m.forEach((n,c)=>{if(look(mm,c)){ok++;pcs+=n}else un.push(c)});
  $('ssum').innerHTML=ok+' barcodes matched, total '+pcs+' pcs.'+(un.length?'<br>Not in stock file ('+un.length+'): '+esc(un.slice(0,8).join(', ')):'')}
$('sf').onchange=async e=>{const f=e.target.files[0];if(!f)return;armed=null;
  try{const rows=await readSheet(f),hi=hdrIdx(rows),h=rows[hi].map(String);sale={f,rows,hi};
    let bc=pick(h,/bar\s*code/i);if(bc<0)bc=Math.max(0,pick(h,/code|sku/i));
    $('sprev').innerHTML='<div class="kv"><b>Barcode column</b><select id="scol">'+opts(h,bc)+'</select><b>Qty column</b><select id="qcol">'+opts(h,pick(h,/qty|quantity|pcs|sold|sale/i))+'</select></div><div id="ssum" class="mini"></div><div id="sbox"></div><button id="sap" style="margin-top:8px">Apply update</button>';
    $('scol').onchange=calc;$('qcol').onchange=calc;
    $('sap').onclick=async()=>{const m=aggSale(),nd=D.map(r=>r.slice()),mm=mk(nd),sub=$('mode').value==='sub';let ok=0,pcs=0,short=0;
      m.forEach((n,c)=>{const r=look(mm,c);if(!r)return;ok++;pcs+=n;const nb=r[5]+(sub?-n:n);if(nb<0)short+=-nb;r[5]=Math.max(0,Math.round(nb))});
      if(!ok){$('sbox').innerHTML='<div class="c err">No barcodes matched. Check the barcode column.</div>';return}
      const sig=(sub?'S':'A')+'|'+sale.f.name+'|'+sale.f.size+'|'+pcs;
      const dup=S.applied.includes(sig)?'<b>Warning:</b> this file was already applied. Applying it again will count it twice. ':'';
      if(!guard('s'+sig+$('mode').value,dup+ok+' barcodes, '+pcs+' pcs will be '+(sub?'removed from stock':'added to stock')+(short?' ('+short+' pcs more than in stock, those will be set to 0)':'')+'. Continue?',$('sbox'),$('sap')))return;
      S.rows=nd;S.updated=new Date().toISOString();S.log.unshift({t:S.updated,k:sub?'Sale':'New stock/Return',f:sale.f.name,n:ok,p:pcs});S.log=S.log.slice(0,15);S.applied.push(sig);S.applied=S.applied.slice(-100);
      $('sap').disabled=true;$('sap').textContent='Updating...';await pub()};
    calc();
  }catch(err){$('sprev').innerHTML='<div class="c err">Could not read the file. Use Excel (.xlsx) or CSV.</div>'}};
$('ff').onchange=async e=>{const f=e.target.files[0];if(!f)return;armed=null;
  try{const rows=await readSheet(f),hi=hdrIdx(rows),h=rows[hi].map(x=>String(x).trim().toLowerCase());
    const ix=n=>h.indexOf(n),iB=ix('barcode'),iBal=ix('balance');
    if(iB<0||iBal<0){$('fprev').innerHTML='<div class="c err">The file needs Barcode and Balance columns.</div>';return}
    const isFull=ix('item name')>=0&&ix('price')>=0,iV=pick(h,/vat/),iT=pick(h,/total/),g=(r,n)=>{const i=ix(n);return i<0||r[i]===''?null:String(r[i]).trim()};
    const list=[];rows.slice(hi+1).forEach(r=>{const c=String(r[iB]).trim();if(!/^\d+$/.test(c))return;const bal=Number(r[iBal]);if(!isFinite(bal))return;
      if(!isFull){list.push([c,bal]);return}
      const pr=Number(r[ix('price')])||0,vat=iV>=0&&r[iV]!==''?Number(r[iV]):pr*0.1,tot=iT>=0&&r[iT]!==''?Number(r[iT]):pr+vat;
      list.push([c,g(r,'item name'),g(r,'style no'),g(r,'color'),g(r,'size'),bal,g(r,'gender'),g(r,'product type'),g(r,'m.category'),pr,vat,tot])});
    const mm=mk(D);let ch=0,nw=0,pcs=0;const seen=new Set();
    list.forEach(x=>{const bal=isFull?x[5]:x[1];pcs+=bal;const r=look(mm,x[0]);if(!r)nw++;else{seen.add(norm(r[0]));if(r[5]!==bal)ch++}});
    const gone=isFull?D.filter(r=>!seen.has(norm(r[0]))).length:0,now=D.reduce((a,r)=>a+r[5],0);
    full={f,list,isFull};
    $('fprev').innerHTML='<div class="mini">'+list.length+' products, total '+pcs+' pcs (now '+now+' pcs). Changed: '+ch+(isFull?', new: '+nw+', removed: '+gone:', not in stock file: '+nw+' (skipped)')+'.</div><div id="fbox"></div><button id="fap" style="margin-top:8px">Apply update</button>';
    $('fap').onclick=async()=>{
      if(!guard('f'+f.name+f.size,isFull?'All stock will be replaced by this file. Continue?':'Only balances will be updated. Continue?',$('fbox'),$('fap')))return;
      let nd;if(isFull)nd=list;else{nd=D.map(r=>r.slice());const m2=mk(nd);list.forEach(x=>{const r=look(m2,x[0]);if(r)r[5]=x[1]})}
      S.rows=nd;S.updated=new Date().toISOString();S.log.unshift({t:S.updated,k:'Full stock',f:f.name,n:ch,p:pcs});S.log=S.log.slice(0,15);
      $('fap').disabled=true;$('fap').textContent='Updating...';await pub()};
  }catch(err){$('fprev').innerHTML='<div class="c err">Could not read the file. Use Excel (.xlsx) or CSV.</div>'}};
})();
</script></body></html>
